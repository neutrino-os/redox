name: Build Redox OS (Native)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Free disk space on runner
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/share/swift
        sudo rm -rf /usr/local/graalvm
        sudo apt-get clean

    - name: Install native build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          bison \
          flex \
          fuse3 \
          libfuse3-dev \
          genisoimage \
          nasm \
          qemu-system-x86 \
          android-sdk-libsparse-utils \
          syslinux \
          syslinux-utils \
          git-lfs \
          curl \
          cmake \
          pkg-config \
          cbindgen \
          just

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rust-src

    - name: Configure Native Build
      run: |
        # PODMAN_BUILD?=0 forces the Makefile to run natively on the host
        cat <<EOF > .config
        PODMAN_BUILD?=0
        ARCH?=x86_64
        CONFIG_NAME?=desktop
        REPO_BINARY?=1
        PREFIX_BINARY?=1
        EOF

    - name: Build Redox OS Image
      run: |
        make all

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: redox-disk-image
        path: |
          build/x86_64/desktop/harddrive.img
          build/x86_64/desktop/harddrive.bin
          build/x86_64/desktop/*.iso
        if-no-files-found: warn

  release:
    name: Create GitHub Pre-release
    needs: build # Ensures release job only runs if build succeeds
    if: github.event_name != 'pull_request' # Prevents release creation on Pull Requests
    runs-on: ubuntu-latest

    steps:
    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: redox-disk-image
        path: artifacts

    - name: Publish Pre-release
      uses: softprops/action-gh-release@v2
      with:
        prerelease: true
        tag_name: "build-${{ github.run_number }}"
        name: "Redox OS Pre-release #${{ github.run_number }}"
        body: |
          ### 🚀 Redox OS Automated Native Build
          This pre-release image was generated automatically by GitHub CI.

          * **Run Number:** `#${{ github.run_number }}`
          * **Branch:** `${{ github.ref_name }}`
          * **Commit SHA:** `${{ github.sha }}`
        files: artifacts/*