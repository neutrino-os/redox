name: Build Redox OS

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Free disk space on runner
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/share/swift
        sudo rm -rf /usr/local/graalvm
        sudo apt-get clean

    - name: Install Podman and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y podman git-lfs curl

    - name: Run Podman Bootstrap & Build Image
      run: |
        # Run bootstrap non-interactively
        echo "y" | bash podman_bootstrap.sh

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: redox-disk-image
        path: |
          build/x86_64/desktop/*.img
          build/x86_64/desktop/*.iso
          build/x86_64/desktop/*.virtualdisk
          build/x86_64/desktop/harddrive.bin
        if-no-files-found: warn